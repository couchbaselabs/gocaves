name: Build and Test
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pre-build project
        run: |
          go run tools/prebuildstep.go
      - name: Test project
        run: |
          go test ./...
